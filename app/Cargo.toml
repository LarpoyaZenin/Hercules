[package]
name = "hercules"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
walkdir = "2.5"
notify = "6.1"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
sysinfo = "0.30"
rfd = "0.13"
